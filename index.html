<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Declaraciones ❤️</title>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#641526;
color:white;
min-height:100vh;
overflow-x:hidden;
}

.corazon{
position:fixed;
color:#ffb0c0;
opacity:.15;
font-size:30px;
z-index:0;
animation:flotar 8s infinite linear;
pointer-events:none;
}

.c1{left:5%;top:20%}
.c2{left:20%;top:70%}
.c3{left:40%;top:30%}
.c4{left:60%;top:80%}
.c5{left:80%;top:25%}
.c6{left:92%;top:60%}

@keyframes flotar{
0%{transform:translateY(40px);opacity:0}
30%{opacity:.2}
100%{transform:translateY(-120px);opacity:0}
}

header{
text-align:center;
padding:45px 15px 25px;
position:relative;
z-index:1;
}

header h1{
font-size:38px;
margin:0 0 8px;
}

header p{opacity:.85}

.contenedor{
width:94%;
max-width:650px;
margin:auto;
position:relative;
z-index:1;
}

.admin-btn{
display:block;
margin:30px auto;
padding:12px 20px;
border:0;
border-radius:10px;
background:#40101b;
color:white;
font-size:15px;
cursor:pointer;
}

#panel{
display:none;
background:white;
color:#351018;
border-radius:18px;
padding:22px;
margin:20px auto;
box-shadow:0 5px 20px #0005;
}

#administracion{display:none}

input,textarea{
width:100%;
padding:12px;
margin:7px 0 14px;
border:1px solid #ccc;
border-radius:9px;
font-size:16px;
font-family:Arial,sans-serif;
}

textarea{
min-height:110px;
resize:vertical;
}

button{
border:0;
border-radius:9px;
padding:11px 16px;
cursor:pointer;
}

.publicar{
width:100%;
background:#741d32;
color:white;
font-size:16px;
}

#error{
color:red;
font-weight:bold;
}

.admin-item{
border:1px solid #ddd;
border-radius:10px;
padding:12px;
margin-top:12px;
}

.admin-item strong{color:#741d32}

.eliminar{
background:#eee;
color:#a00020;
margin-top:8px;
}

.tituloDeclaraciones{
text-align:center;
margin-top:40px;
margin-bottom:20px;
}

.declaracion{
background:#efe7de;
color:#222;
padding:10px 12px 7px;
margin:13px 0;
border-radius:9px;
box-shadow:0 2px 5px #0005;
position:relative;
max-width:90%;
margin-left:auto;
}

.declaracion:after{
content:"";
position:absolute;
right:-7px;
top:0;
border-width:0 0 12px 12px;
border-style:solid;
border-color:transparent transparent transparent #efe7de;
}

.nombre{
font-weight:bold;
color:#8b2140;
font-size:15px;
margin-bottom:5px;
}

.curso{
font-weight:normal;
color:#777;
font-size:12px;
display:inline;
margin-left:5px;
}

.texto{
font-size:16px;
line-height:1.4;
word-wrap:break-word;
}

.info{
text-align:right;
font-size:11px;
color:#777;
margin-top:4px;
}

.vacio{
text-align:center;
padding:40px 10px;
opacity:.8;
}

footer{
text-align:center;
padding:30px;
opacity:.7;
}

.mensaje{
font-size:14px;
margin-top:10px;
}

@media(max-width:500px){
header h1{font-size:31px}
.declaracion{max-width:94%}
}
</style>
</head>

<body>

<div class="corazon c1">♥</div>
<div class="corazon c2">♡</div>
<div class="corazon c3">♥</div>
<div class="corazon c4">♡</div>
<div class="corazon c5">♥</div>
<div class="corazon c6">♡</div>

<header>
<h1>💌 Declaraciones</h1>
<p>Las declaraciones de nuestra comunidad escolar ❤️</p>
</header>

<div class="contenedor">

<button class="admin-btn" onclick="abrirAdmin()">
🔐 Panel de administrador
</button>

<div id="panel">

<div id="login">

<h2>🔐 Administrador</h2>

<p>Ingresá con tu cuenta de administrador.</p>

<input
type="email"
id="email"
placeholder="Correo electrónico">

<input
type="password"
id="password"
placeholder="Contraseña">

<button class="publicar" onclick="login()">
Entrar
</button>

<p id="error"></p>

</div>

<div id="administracion">

<h2>💌 Nueva declaración</h2>

<label>Nombre</label>

<input
id="nombre"
placeholder="Anónimo"
maxlength="50">

<label>Curso</label>

<input
id="curso"
placeholder="Ej: 4°B"
maxlength="20">

<label>Declaración</label>

<textarea
id="texto"
placeholder="Escribí la declaración..."
maxlength="500"></textarea>

<button class="publicar" onclick="publicar()">
❤️ Publicar
</button>

<h3>Administrar declaraciones</h3>

<div id="listaAdmin"></div>

<button
class="eliminar"
onclick="cerrarSesion()">
🚪 Cerrar sesión
</button>

</div>
</div>

<h2 class="tituloDeclaraciones">
💌 Declaraciones publicadas
</h2>

<div id="declaraciones"></div>

<div id="vacio" class="vacio">
Todavía no hay declaraciones 💌
</div>

</div>

<footer>
Hecho con ❤️ para el colegio
</footer>

<script>

/* =========================
   FIREBASE
========================= */

const firebaseConfig = {
apiKey: "AIzaSyCF5wBGYrATIic99em2aYoZG4eHYkl9nQc",
authDomain: "declaraciones-d104a.firebaseapp.com",
databaseURL: "https://declaraciones-d104a-default-rtdb.firebaseio.com/",
projectId: "declaraciones-d104a",
storageBucket: "declaraciones-d104a.firebasestorage.app",
messagingSenderId: "413894654793",
appId: "1:413894654793:web:c5d573bb74f92b12bb3898"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

const declaracionesRef = db.ref("declaraciones");

/* TU UID DE ADMINISTRADOR */

const ADMIN_UID = "wjVSdbX4heMyx1NBasUnWA6LnYn2";


/* =========================
   ESCAPAR TEXTO
========================= */

function escapar(t){

let d = document.createElement("div");

d.textContent = t || "";

return d.innerHTML;

}


/* =========================
   MOSTRAR DECLARACIONES
========================= */

function mostrar(){

const cont =
document.getElementById("declaraciones");

const vacio =
document.getElementById("vacio");

declaracionesRef
.orderByChild("timestamp")
.on("value", snapshot => {

cont.innerHTML = "";

let datos = [];

snapshot.forEach(child => {

datos.push({
id: child.key,
...child.val()
});

});

datos.reverse();

if(!datos.length){

vacio.style.display = "block";

return;

}

vacio.style.display = "none";

datos.forEach(x => {

let hora = x.hora || "Ahora";

cont.innerHTML += `

<div class="declaracion">

<div class="nombre">

💌 ${escapar(x.nombre)}

<span class="curso">

· ${escapar(x.curso || "")}

</span>

</div>

<div class="texto">

${escapar(x.texto)}

</div>

<div class="info">

${escapar(hora)} ✓✓

</div>

</div>

`;

});

});

}


/* =========================
   ABRIR PANEL
========================= */

function abrirAdmin(){

let p = document.getElementById("panel");

if(p.style.display === "block"){

p.style.display = "none";

}else{

p.style.display = "block";

}

}


/* =========================
   LOGIN FIREBASE
========================= */

function login(){

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

const error =
document.getElementById("error");

error.textContent = "";

auth.signInWithEmailAndPassword(email,password)

.then(result => {

if(result.user.uid !== ADMIN_UID){

error.textContent =
"❌ Esta cuenta no es administradora.";

auth.signOut();

return;

}

document.getElementById("login").style.display="none";

document.getElementById("administracion").style.display="block";

mostrarAdmin();

})

.catch(err => {

error.textContent =
"❌ Correo o contraseña incorrectos.";

});

}


/* =========================
   PUBLICAR
========================= */

function publicar(){

const nombre =
document.getElementById("nombre").value.trim() || "Anónimo";

const curso =
document.getElementById("curso").value.trim();

const texto =
document.getElementById("texto").value.trim();

if(!texto){

alert("Escribí una declaración.");

return;

}

const ahora = new Date();

const hora =
ahora.getHours().toString().padStart(2,"0")
+
":"
+
ahora.getMinutes().toString().padStart(2,"0");

const nueva = {

nombre: nombre,

curso: curso,

texto: texto,

hora: hora,

timestamp: Date.now()

};

declaracionesRef.push(nueva)

.then(() => {

document.getElementById("nombre").value="";

document.getElementById("curso").value="";

document.getElementById("texto").value="";

alert("❤️ Declaración publicada correctamente.");

})

.catch(() => {

alert("❌ No se pudo publicar la declaración.");

});

}


/* =========================
   MOSTRAR ADMIN
========================= */

function mostrarAdmin(){

const lista =
document.getElementById("listaAdmin");

declaracionesRef
.orderByChild("timestamp")
.on("value", snapshot => {

lista.innerHTML = "";

let datos = [];

snapshot.forEach(child => {

datos.push({
id: child.key,
...child.val()
});

});

datos.reverse();

datos.forEach(x => {

lista.innerHTML += `

<div class="admin-item">

<strong>

${escapar(x.nombre)}

</strong>

<small>

· ${escapar(x.curso || "")}

</small>

<p>

${escapar(x.texto)}

</p>

<button
class="eliminar"
onclick="eliminar('${x.id}')">

🗑️ Eliminar

</button>

</div>

`;

});

});

}


/* =========================
   ELIMINAR
========================= */

function eliminar(id){

const usuario = auth.currentUser;

if(!usuario || usuario.uid !== ADMIN_UID){

alert("❌ No tenés permiso para eliminar.");

return;

}

if(!confirm("¿Eliminar esta declaración?")){

return;

}

declaracionesRef
.child(id)
.remove()

.then(() => {

alert("🗑️ Declaración eliminada.");

})

.catch(() => {

alert("❌ No se pudo eliminar.");

});

}


/* =========================
   CERRAR SESIÓN
========================= */

function cerrarSesion(){

auth.signOut();

document.getElementById("administracion").style.display="none";

document.getElementById("login").style.display="block";

document.getElementById("password").value="";

}


/* =========================
   COMPROBAR SESIÓN
========================= */

auth.onAuthStateChanged(user => {

if(user && user.uid === ADMIN_UID){

document.getElementById("login").style.display="none";

document.getElementById("administracion").style.display="block";

mostrarAdmin();

}else{

document.getElementById("login").style.display="block";

document.getElementById("administracion").style.display="none";

}

});


/* =========================
   INICIAR
========================= */

mostrar();

</script>

</body>
   </html>
